services:
  mongodb:
    image: mongo:7.0
    container_name: learnsphere-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: learnsphere-server
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/learnsphere
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev_access_secret_replace_in_production_min_32_chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_refresh_secret_replace_in_production_min_32_chars}
      CLIENT_URL: http://localhost:5173
      STORAGE_PROVIDER: local
      UPLOAD_DIR: uploads
    ports:
      - '5000:5000'
    volumes:
      - uploads_data:/app/uploads

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:5000/api/v1
        VITE_SOCKET_URL: http://localhost:5000
    container_name: learnsphere-client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - '5173:80'

volumes:
  mongodb_data:
  uploads_data:
